<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="160" height="160" role="img" aria-labelledby="t">
  <title id="t">Agent Evaluator mascot: a kawaii robot with big eyes holding a checkmark</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#8f7cf5"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fffafc"/>
      <stop offset="1" stop-color="#ffe3f1"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="120" cy="222" rx="62" ry="8" fill="#000" opacity=".12"/>

  <!-- antenna -->
  <path d="M120 44 Q120 28 128 22" stroke="#7a68e0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="20" r="9" fill="#ff8fc1" stroke="#7a68e0" stroke-width="4"/>
  <circle cx="127" cy="17" r="2.5" fill="#fff"/>

  <!-- ears -->
  <rect x="22" y="104" width="22" height="42" rx="11" fill="#8f7cf5" stroke="#7a68e0" stroke-width="4"/>
  <rect x="196" y="104" width="22" height="42" rx="11" fill="#8f7cf5" stroke="#7a68e0" stroke-width="4"/>

  <!-- head -->
  <rect x="34" y="42" width="172" height="152" rx="64" fill="url(#body)" stroke="#7a68e0" stroke-width="5"/>
  <!-- face screen -->
  <rect x="50" y="62" width="140" height="114" rx="50" fill="url(#face)"/>

  <!-- eyes -->
  <g>
    <ellipse cx="90" cy="115" rx="21" ry="25" fill="#3b2f6b"/>
    <ellipse cx="150" cy="115" rx="21" ry="25" fill="#3b2f6b"/>
    <ellipse cx="90" cy="119" rx="14" ry="17" fill="#6a56d6" opacity=".7"/>
    <ellipse cx="150" cy="119" rx="14" ry="17" fill="#6a56d6" opacity=".7"/>
    <circle cx="83" cy="106" r="8" fill="#fff"/>
    <circle cx="143" cy="106" r="8" fill="#fff"/>
    <circle cx="98" cy="127" r="4" fill="#fff"/>
    <circle cx="158" cy="127" r="4" fill="#fff"/>
    <circle cx="96" cy="104" r="2" fill="#fff" opacity=".8"/>
    <circle cx="156" cy="104" r="2" fill="#fff" opacity=".8"/>
  </g>

  <!-- blush -->
  <ellipse cx="66" cy="148" rx="12" ry="7" fill="#ff8fc1" opacity=".55"/>
  <ellipse cx="174" cy="148" rx="12" ry="7" fill="#ff8fc1" opacity=".55"/>

  <!-- mouth (little cat smile) -->
  <path d="M108 150 Q114 160 120 150 Q126 160 132 150" stroke="#3b2f6b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- body hint + checkmark badge -->
  <circle cx="186" cy="188" r="30" fill="#5fd9a0" stroke="#fff" stroke-width="6"/>
  <path d="M172 188 L182 198 L201 177" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M32 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffd966"/>
  <path d="M210 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ff8fc1"/>
  <path d="M26 188 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffd966"/>
</svg>
